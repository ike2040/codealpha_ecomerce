<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dde3ea;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tvBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c2c2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- TV Stand base plate -->
  <g filter="url(#shadow)">
    <rect x="185" y="390" width="130" height="12" rx="6" fill="#3a3a3c"/>
  </g>

  <!-- TV Stand neck -->
  <rect x="238" y="360" width="24" height="38" rx="4" fill="#2c2c2e"/>

  <!-- TV body outer frame -->
  <g filter="url(#shadow)">
    <rect x="45" y="70" width="410" height="295" rx="12" fill="url(#tvBody)"/>
  </g>

  <!-- Screen area -->
  <rect x="55" y="80" width="390" height="275" rx="6" fill="url(#screenGrad)"/>

  <!-- 4K Content simulation on screen - scenic mountain wallpaper -->
  <rect x="55" y="80" width="390" height="275" rx="6" fill="#0a1628"/>
  <!-- Sky gradient overlay -->
  <rect x="55" y="80" width="390" height="120" rx="6" fill="#1a3a6b" opacity="0.8"/>
  <!-- Mountain silhouette -->
  <polygon points="55,200 130,130 200,180 250,120 320,160 390,110 445,170 445,355 55,355" fill="#0d1f3c"/>
  <!-- Snow caps -->
  <polygon points="250,120 270,140 230,140" fill="white" opacity="0.7"/>
  <polygon points="390,110 408,130 372,130" fill="white" opacity="0.5"/>
  <!-- Stars -->
  <circle cx="100" cy="95" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="180" cy="88" r="1" fill="white" opacity="0.7"/>
  <circle cx="330" cy="92" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="400" cy="85" r="1" fill="white" opacity="0.6"/>
  <circle cx="140" cy="105" r="1" fill="white" opacity="0.5"/>

  <!-- 4K badge on screen -->
  <rect x="65" y="88" width="38" height="18" rx="3" fill="#ffffff20"/>
  <text x="84" y="101" font-size="10" font-weight="700" fill="white" font-family="Arial" text-anchor="middle">4K HDR</text>

  <!-- Bezel bottom with Samsung logo -->
  <rect x="55" y="340" width="390" height="18" rx="0" fill="#1c1c1e"/>
  <text x="250" y="353" font-size="9" font-weight="700" fill="#555" font-family="Arial" text-anchor="middle" letter-spacing="3">SAMSUNG</text>

  <!-- Power LED -->
  <circle cx="430" cy="349" r="3" fill="#1db954"/>

  <!-- Remote control (small, below stand) -->
  <rect x="340" y="400" width="36" height="58" rx="8" fill="#2c2c2e"/>
  <circle cx="358" cy="415" r="5" fill="#4a4a4c"/>
  <rect x="348" y="425" width="20" height="3" rx="1" fill="#3a3a3c"/>
  <rect x="348" y="432" width="20" height="3" rx="1" fill="#3a3a3c"/>
  <rect x="348" y="439" width="20" height="3" rx="1" fill="#3a3a3c"/>
  <circle cx="358" cy="450" r="4" fill="#1d4ed8"/>

  <!-- Brand text -->
  <text x="250" y="486" font-size="13" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif" text-anchor="middle">Samsung 55" Crystal 4K UHD Smart TV</text>
</svg>
