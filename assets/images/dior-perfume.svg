<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6d50;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#c4a96e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#e8d5a3;stop-opacity:0.95"/>
      <stop offset="75%" style="stop-color:#c4a96e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c6d50;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#d4b896;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d1a0a;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-5%" width="140%" height="120%">
      <feDropShadow dx="8" dy="15" stdDeviation="18" flood-color="#00000060"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Background glow -->
  <ellipse cx="250" cy="280" rx="100" ry="180" fill="#f59e0b" opacity="0.08"/>

  <!-- Perfume bottle -->
  <g filter="url(#shadow)">
    <!-- Bottle base -->
    <rect x="155" y="220" width="190" height="240" rx="18" fill="url(#bottleGrad)"/>

    <!-- Glass edge highlight (left) -->
    <rect x="155" y="220" width="12" height="240" rx="8" fill="white" opacity="0.2"/>
    <!-- Glass edge highlight (right) -->
    <rect x="333" y="220" width="12" height="240" rx="8" fill="black" opacity="0.15"/>

    <!-- CENTER LABEL -->
    <rect x="170" y="280" width="160" height="140" rx="8" fill="url(#labelGrad)"/>
    <!-- Label border -->
    <rect x="174" y="284" width="152" height="132" rx="5" fill="none" stroke="#c4a96e" stroke-width="1.5"/>
    <!-- Label inner border -->
    <rect x="178" y="288" width="144" height="124" rx="3" fill="none" stroke="#c4a96e" stroke-width="0.5" opacity="0.7"/>

    <!-- Dior logo -->
    <text x="250" y="315" font-size="22" font-weight="900" fill="#c4a96e" font-family="Georgia, serif" text-anchor="middle" letter-spacing="4">DIOR</text>
    <!-- Divider line -->
    <line x1="190" y1="322" x2="310" y2="322" stroke="#c4a96e" stroke-width="0.8" opacity="0.7"/>
    <!-- Sauvage name -->
    <text x="250" y="345" font-size="15" fill="#e8d5a3" font-family="Georgia, serif" text-anchor="middle" letter-spacing="3" font-style="italic">Sauvage</text>
    <!-- EDP label -->
    <text x="250" y="368" font-size="9" fill="#c4a96e" font-family="Arial" text-anchor="middle" letter-spacing="2">EAU DE PARFUM</text>
    <!-- Volume -->
    <text x="250" y="387" font-size="9" fill="#8b7355" font-family="Arial" text-anchor="middle">100 ml · 3.4 fl. oz.</text>

    <!-- Fleur pattern (decorative) -->
    <circle cx="250" cy="405" r="8" fill="none" stroke="#c4a96e" stroke-width="0.8" opacity="0.5"/>
    <line x1="250" y1="397" x2="250" y2="413" stroke="#c4a96e" stroke-width="0.5" opacity="0.5"/>
    <line x1="242" y1="405" x2="258" y2="405" stroke="#c4a96e" stroke-width="0.5" opacity="0.5"/>

    <!-- Glass body texture (very subtle dots) -->
    <rect x="155" y="220" width="190" height="60" rx="18" fill="white" opacity="0.06"/>
  </g>

  <!-- Shoulder / Neck -->
  <g filter="url(#shadow)">
    <rect x="195" y="165" width="110" height="60" rx="10" fill="url(#bottleGrad)"/>
    <rect x="195" y="165" width="8" height="60" rx="6" fill="white" opacity="0.15"/>
  </g>

  <!-- CAP / ATOMISER -->
  <g filter="url(#shadow)">
    <rect x="215" y="90" width="70" height="80" rx="12" fill="url(#capGrad)"/>
    <!-- Cap highlight -->
    <rect x="215" y="90" width="8" height="80" rx="8" fill="white" opacity="0.2"/>
    <!-- Cap top -->
    <rect x="220" y="88" width="60" height="10" rx="5" fill="#d4b896"/>
    <!-- Spray nozzle -->
    <rect x="246" y="75" width="8" height="18" rx="4" fill="#8b7355"/>
    <rect x="242" y="72" width="16" height="6" rx="3" fill="#c4a96e"/>
    <!-- Spray mist -->
    <circle cx="255" cy="60" r="2" fill="#c4a96e" opacity="0.4"/>
    <circle cx="265" cy="52" r="1.5" fill="#c4a96e" opacity="0.3"/>
    <circle cx="248" cy="55" r="1" fill="#c4a96e" opacity="0.2"/>
    <circle cx="270" cy="62" r="1.5" fill="#c4a96e" opacity="0.25"/>
  </g>

  <!-- Brand text -->
  <text x="250" y="465" font-size="18" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif" text-anchor="middle">Dior Sauvage EDP</text>
  <text x="250" y="486" font-size="13" fill="#92400e" font-family="Arial, sans-serif" text-anchor="middle">100ml · Men's Eau de Parfum · Bergamot &amp; Cedar</text>
</svg>
