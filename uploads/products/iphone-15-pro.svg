<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="tiFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4cfc7" />
      <stop offset="50%" stop-color="#9a958d" />
      <stop offset="100%" stop-color="#6f6a63" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glassBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e5df" />
      <stop offset="50%" stop-color="#c8c3b9" />
      <stop offset="100%" stop-color="#a39e94" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0a0e2a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="540" rx="160" ry="18" fill="#0a0e2a" opacity="0.12" />

  <!-- Phone 1: Back View (Left Angled) -->
  <g transform="translate(90, 70)" filter="url(#phoneShadow)">
    <!-- Chassis Outer Frame -->
    <rect x="0" y="0" width="200" height="410" rx="36" fill="url(#tiFrame)" stroke="#59544e" stroke-width="1.5" />
    <!-- Glass Back -->
    <rect x="3" y="3" width="194" height="404" rx="33" fill="url(#glassBack)" />

    <!-- Camera Island (Frosted Plateau) -->
    <rect x="14" y="14" width="88" height="88" rx="22" fill="#d9d5cd" stroke="#bbb6ac" stroke-width="1" />
    
    <!-- Camera Lens 1 (Top Left) -->
    <circle cx="38" cy="38" r="18" fill="#18181b" stroke="#9a958d" stroke-width="3" />
    <circle cx="38" cy="38" r="13" fill="#09090b" />
    <circle cx="36" cy="36" r="5" fill="#3b82f6" opacity="0.6" />
    <circle cx="34" cy="34" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Camera Lens 2 (Bottom Left) -->
    <circle cx="38" cy="78" r="18" fill="#18181b" stroke="#9a958d" stroke-width="3" />
    <circle cx="38" cy="78" r="13" fill="#09090b" />
    <circle cx="36" cy="76" r="5" fill="#3b82f6" opacity="0.6" />
    <circle cx="34" cy="74" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Camera Lens 3 (Right Center) -->
    <circle cx="78" cy="58" r="18" fill="#18181b" stroke="#9a958d" stroke-width="3" />
    <circle cx="78" cy="58" r="13" fill="#09090b" />
    <circle cx="76" cy="56" r="5" fill="#3b82f6" opacity="0.6" />
    <circle cx="74" cy="54" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Flash & LiDAR -->
    <circle cx="78" cy="28" r="6" fill="#fef08a" stroke="#d4d4d8" stroke-width="1.5" />
    <circle cx="78" cy="86" r="4.5" fill="#18181b" />

    <!-- Apple Logo Emboss (Subtle) -->
    <path d="M100 205 C96 205 92 208 89 208 C86 208 82 205 78 205 C71 205 64 210 60 219 C52 234 58 256 66 267 C70 273 74 279 80 279 C85 279 88 276 93 276 C98 276 100 279 106 279 C112 279 116 273 120 267 C124 260 126 254 126 253 C126 252 115 248 115 235 C115 225 124 219 125 218 C120 211 112 205 100 205 Z" fill="#8c8780" opacity="0.45" />
    <path d="M96 195 C98 192 100 188 99 184 C95 184 91 187 89 190 C87 193 85 197 86 201 C90 201 94 198 96 195 Z" fill="#8c8780" opacity="0.45" />
  </g>

  <!-- Phone 2: Front View (Right Center) -->
  <g transform="translate(200, 40)" filter="url(#phoneShadow)">
    <!-- Chassis Outer Frame -->
    <rect x="0" y="0" width="205" height="420" rx="38" fill="url(#tiFrame)" stroke="#59544e" stroke-width="1.5" />
    <!-- Bezel -->
    <rect x="3" y="3" width="199" height="414" rx="35" fill="#000000" />
    <!-- Super Retina OLED Screen -->
    <rect x="6" y="6" width="193" height="408" rx="32" fill="url(#screenGrad)" />

    <!-- Screen Wallpaper Graphics: Light Curve -->
    <path d="M6 310 Q102 180 199 260 L199 414 L6 414 Z" fill="#0a0a0f" opacity="0.7" />
    <path d="M6 240 Q110 350 199 180 L199 6 L6 6 Z" fill="#18182b" opacity="0.45" />

    <!-- Dynamic Island Pill -->
    <rect x="70" y="16" width="65" height="18" rx="9" fill="#000000" />
    <circle cx="80" cy="25" r="4" fill="#09090b" stroke="#18181b" stroke-width="1" />
    <circle cx="120" cy="25" r="3.5" fill="#09090b" />

    <!-- Clock & Lock Screen UI -->
    <text x="102" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.95">09:41</text>
    <text x="102" y="86" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#e2e8f0" text-anchor="middle" opacity="0.8">Friday, September 12</text>

    <!-- Bottom Home Indicator -->
    <rect x="67" y="402" width="70" height="3" rx="1.5" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Jumia Quality / Official Badge -->
  <g transform="translate(30, 480)">
    <rect width="130" height="32" rx="16" fill="#0A0E2A" />
    <text x="65" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FF5436" text-anchor="middle" letter-spacing="1">TITANIUM 15 PRO</text>
  </g>
</svg>
