    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/><stop offset="100%" style="stop-color:#2d5281;stop-opacity:1"/></linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1"/><stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1"/></linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="10" stdDeviation="14" flood-color="#00000045"/></filter>
