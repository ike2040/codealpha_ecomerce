<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000030"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="340" height="210" rx="12" fill="url(#lidGrad)"/>
    <rect x="90" y="90" width="320" height="190" rx="8" fill="url(#screenGrad)"/>
    <rect x="95" y="95" width="310" height="180" rx="6" fill="#1e3a5f"/>
    <ellipse cx="250" cy="185" rx="160" ry="100" fill="#3b82f6" opacity="0.3"/>
    <ellipse cx="200" cy="150" rx="90" ry="60" fill="#60a5fa" opacity="0.2"/>
    <rect x="95" y="95" width="310" height="18" rx="0" fill="#00000040"/>
    <text x="110" y="108" font-size="11" fill="white" font-family="Arial">&#xF8FF; File Edit View</text>
    <rect x="175" y="258" width="150" height="14" rx="7" fill="#ffffff20"/>
    <rect x="183" y="261" width="9" height="8" rx="2" fill="#3b82f6"/>
    <rect x="196" y="261" width="9" height="8" rx="2" fill="#10b981"/>
    <rect x="209" y="261" width="9" height="8" rx="2" fill="#f59e0b"/>
    <rect x="222" y="261" width="9" height="8" rx="2" fill="#ef4444"/>
    <circle cx="250" cy="93" r="2.5" fill="#333"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="65" y="288" width="370" height="24" rx="4" fill="url(#baseGrad)"/>
    <rect x="80" y="285" width="340" height="6" rx="3" fill="#b0b4bc"/>
    <rect x="188" y="296" width="124" height="10" rx="2" fill="#c8ccd4"/>
