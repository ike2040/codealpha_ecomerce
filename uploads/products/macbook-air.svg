  </g>
  <text x="250" y="370" font-size="22" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif" text-anchor="middle">MacBook Air M3</text>
  <text x="250" y="395" font-size="13" fill="#64748b" font-family="Arial, sans-serif" text-anchor="middle">13.6" Liquid Retina · 8GB RAM · 256GB SSD</text>
  <text x="250" y="418" font-size="13" fill="#94a3b8" font-family="Arial, sans-serif" text-anchor="middle">Starlight Aluminum</text>
  <rect x="125" y="435" width="75" height="22" rx="11" fill="#dbeafe"/>
  <text x="162" y="450" font-size="10" fill="#1d4ed8" font-family="Arial" text-anchor="middle" font-weight="600">M3 Chip</text>
  <rect x="213" y="435" width="75" height="22" rx="11" fill="#dcfce7"/>
  <text x="250" y="450" font-size="10" fill="#15803d" font-family="Arial" text-anchor="middle" font-weight="600">18hr Battery</text>
  <rect x="301" y="435" width="75" height="22" rx="11" fill="#fef3c7"/>
  <text x="338" y="450" font-size="10" fill="#b45309" font-family="Arial" text-anchor="middle" font-weight="600">MagSafe 3</text>
